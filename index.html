  body{
    min-height: 100vh;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, #E9EBED 0%, #DEE1E4 100%);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 28px 16px 56px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------------- CARTÃO ---------------- */
  .card{
    width: 100%;
    max-width: 440px;
    background: var(--rubic-white);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: var(--shadow-soft);
  }

  /* ---------------- HERO (topo escuro com logo, nome e cargo) ---------------- */
  .hero{
    position: relative;
    padding: 44px 28px 88px;
    text-align: center;
    background: radial-gradient(120% 140% at 20% 0%, #3C4147 0%, var(--rubic-graphite) 45%, var(--rubic-graphite-deep) 100%);
    overflow: hidden;
  }

  /* Hexágono decorativo de fundo, no estilo do ícone da marca Rubic */
  .hero-hex{
    position: absolute;
    top: -60px;
    right: -70px;
    width: 260px;
    height: 260px;
    opacity: 0.10;
    pointer-events: none;
  }
  .hero-hex-2{
    position: absolute;
    bottom: -40px;
    left: -60px;
    width: 180px;
    height: 180px;
    opacity: 0.08;
    pointer-events: none;
    transform: rotate(18deg);
  }

  .hero-logo{
    position: relative;
    width: 168px;
    max-width: 60%;
    height: auto;
    margin: 0 auto 30px;
    display: block;
  }

  .avatar-photo{
    position: relative;
    width: 108px;
    height: 108px;
    border-radius: 50%;
    margin: 0 auto 22px;
    background: var(--rubic-white);
    border: 3px solid rgba(255,255,255,0.85);
    box-shadow: 0 8px 22px rgba(0,0,0,0.28);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .avatar-photo img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* Se nenhuma foto for usada, a marca substitui o avatar (ver JS: usePhoto) */
  .avatar-photo.brand-fallback img{
    width: 66%;
    height: 66%;
    object-fit: contain;
  }

  .hero h1{
    position: relative;
    margin: 0;
    color: var(--rubic-white);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  .hero .role{
    position: relative;
    display: inline-block;
    margin-top: 10px;
    color: var(--rubic-orange);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 1.8px;
    text-transform: uppercase;
  }

  .hero .company{
    position: relative;
    margin-top: 4px;
    color: rgba(255,255,255,0.72);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .hero .divider{
    position: relative;
    width: 42px;
    height: 3px;
    margin: 18px auto 16px;
    background: var(--rubic-orange);
    border-radius: 3px;
  }

  .hero .description{
    position: relative;
    margin: 0 auto;
    max-width: 300px;
    color: rgba(255,255,255,0.75);
    font-size: 13.5px;
    line-height: 1.65;
    font-weight: 400;
  }

  /* ---------------- CORPO (botões de ação) ---------------- */
  .sheet{
    position: relative;
    margin-top: -48px;
    background: var(--rubic-white);
    border-radius: 28px 28px 0 0;
    padding: 34px 22px 26px;
  }

  /* Botão principal — Salvar Contato (vCard) */
  .btn-save{
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 17px 20px;
    margin-bottom: 26px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--rubic-orange) 0%, var(--rubic-orange-dark) 100%);
    color: var(--rubic-white);
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    box-shadow: var(--shadow-btn);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-save:hover{ transform: translateY(-2px); box-shadow: 0 18px 30px rgba(246,102,0,0.36); }
  .btn-save:active{ transform: translateY(0); }
  .btn-save i{ font-size: 18px; }

  /* Lista de botões de contato */
  .contact-list{
    list-style: none;
    margin: 0 0 6px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .contact-row{
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 16px;
    background: var(--rubic-gray-50);
    border: 1px solid var(--rubic-gray-100);
    border-radius: 16px;
    text-decoration: none;
    color: inherit;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .contact-row:hover{
    background: var(--rubic-white);
    box-shadow: var(--shadow-soft);
    transform: translateY(-2px);
  }
  .contact-row:active{ transform: translateY(0); }

  .contact-icon{
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--rubic-white);
    font-size: 18px;
  }
  .contact-icon.bg-orange{ background: linear-gradient(135deg, var(--rubic-orange) 0%, var(--rubic-orange-dark) 100%); }
  .contact-icon.bg-graphite{ background: linear-gradient(135deg, #4A4F55 0%, var(--rubic-graphite-deep) 100%); }

  .contact-text{
    flex: 1 1 auto;
    min-width: 0;
  }
  .contact-text strong{
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--rubic-graphite);
  }
  .contact-text span{
    display: block;
    margin-top: 2px;
    font-size: 12.5px;
    font-weight: 400;
    color: var(--rubic-gray-600);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .contact-chevron{
    flex: 0 0 auto;
    color: var(--rubic-gray-400);
    font-size: 13px;
  }

  /* ---------------- RODAPÉ ---------------- */
  .footer{
    text-align: center;
    margin-top: 30px;
    padding-top: 22px;
    border-top: 1px solid var(--rubic-gray-100);
  }
  .footer img{
    width: 118px;
    height: auto;
    opacity: 0.92;
    margin-bottom: 10px;
  }
  .footer p{
    margin: 0;
    font-size: 11px;
    color: var(--rubic-gray-400);
    letter-spacing: 0.2px;
  }

  @media (max-width: 360px){
    .hero{ padding: 36px 20px 80px; }
    .sheet{ padding: 30px 16px 22px; }
  }
</style>
</head>

<script>
  /* ===================================================================
     ============  EDITE OS DADOS DO CARTÃO SOMENTE AQUI  =============
     ===================================================================
     Este é o ÚNICO lugar do arquivo que precisa ser alterado para
     trocar a pessoa/contato do cartão. Todos os textos, links e o
     arquivo .vcf ("Salvar Contato") são gerados automaticamente a
     partir destes valores.

     Campos:
       name              -> nome completo exibido no cartão
       role              -> cargo (exibido em laranja)
       company           -> nome da empresa
       description       -> frase curta de apresentação
       phoneDisplay      -> telefone formatado, para exibição na tela
       phoneDial         -> telefone em formato internacional p/ o link
                             "tel:" (mesmo número de phoneDisplay, sem
                             espaços/parênteses/traços)
       whatsappNumber    -> número do WhatsApp SOMENTE dígitos, com DDI
                             (ex: 55 + DDD + número), usado em wa.me
       whatsappDisplay   -> texto exibido na linha do WhatsApp
       email             -> e-mail de contato (usado no mailto: e na tela)
       website           -> URL completa do site (com http:// ou https://)
       websiteDisplay    -> texto exibido na linha do Site
       instagram         -> URL completa do perfil do Instagram
       instagramDisplay  -> texto exibido na linha do Instagram (ex: @usuario)
  =================================================================== */
  const RUBIC_CARD = {
    name: "Silvia Benassi",
    role: "Sócia Diretora",
    company: "Rubic Engenharia Integral",
    description: "Gestão e fiscalização de obras, assessoria técnica e engenharia integral para empreendimentos de alto padrão.",

    phoneDisplay: "+55 (11) 98945-7447",
    phoneDial: "+5511989457447",

    whatsappNumber: "5511989457447",
    whatsappDisplay: "+55 11 98945-7447",

    email: "silvia_benassi@rubicengenharia.com.br",

    website: "http://www.rubicengenharia.com.br",
    websiteDisplay: "www.rubicengenharia.com.br",

    instagram: "https://instagram.com/rubicengenharia",
    instagramDisplay: "@rubicengenharia",
  };
  /* =================== FIM DA ÁREA DE EDIÇÃO ======================== */


  /* ===================================================================
     A partir daqui é só lógica de renderização — não precisa mexer.
  =================================================================== */

  function renderCard(data){
    document.title = data.name + " | " + data.company;

    document.getElementById("cardName").textContent = data.name;
    document.getElementById("cardRole").textContent = data.role;
    document.getElementById("cardCompany").textContent = data.company;
    document.getElementById("cardDescription").textContent = data.description;

    // Telefone (liga direto pelo celular)
    const linkPhone = document.getElementById("linkPhone");
    linkPhone.href = "tel:" + data.phoneDial;
    document.getElementById("phoneDisplay").textContent = data.phoneDisplay;

    // WhatsApp (abre conversa via wa.me)
    const linkWhatsapp = document.getElementById("linkWhatsapp");
    linkWhatsapp.href = "https://wa.me/" + data.whatsappNumber;
    document.getElementById("whatsappDisplay").textContent = data.whatsappDisplay;

    // E-mail
    const linkEmail = document.getElementById("linkEmail");
    linkEmail.href = "mailto:" + data.email;
    document.getElementById("emailDisplay").textContent = data.email;

    // Site (nova aba)
    const linkSite = document.getElementById("linkSite");
    linkSite.href = data.website;
    document.getElementById("siteDisplay").textContent = data.websiteDisplay;

    // Instagram (nova aba)
    const linkInstagram = document.getElementById("linkInstagram");
    linkInstagram.href = data.instagram;
    document.getElementById("instagramDisplay").textContent = data.instagramDisplay;

    document.getElementById("year").textContent = new Date().getFullYear();
  }

  // Monta o conteúdo de um arquivo .vcf (vCard 3.0) a partir dos dados do cartão
  function buildVCard(data){
    const nameParts = data.name.trim().split(/\s+/);
    const firstName = nameParts.shift() || "";
    const lastName = nameParts.join(" ");

    const lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:" + lastName + ";" + firstName + ";;;",
      "FN:" + data.name,
      "ORG:" + data.company,
      "TITLE:" + data.role,
      "TEL;TYPE=CELL,VOICE:" + data.phoneDial,
      "EMAIL;TYPE=INTERNET,WORK:" + data.email,
      "URL:" + data.website,
      "END:VCARD",
    ];
    return lines.join("\r\n");
  }

  // Gera o arquivo .vcf e dispara o download no navegador
  function downloadVCard(data){
    const vcardText = buildVCard(data);
    const blob = new Blob([vcardText], { type: "text/vcard;charset=utf-8" });
    const url = URL.createObjectURL(blob);

    const fileNameSafe = data.name.trim().replace(/\s+/g, "_");
    const tempLink = document.createElement("a");
    tempLink.href = url;
    tempLink.download = fileNameSafe + ".vcf";
    document.body.appendChild(tempLink);
    tempLink.click();
    document.body.removeChild(tempLink);

    // libera a memória usada pelo blob após o download iniciar
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  }

  renderCard(RUBIC_CARD);

  document.getElementById("btnSaveContact").addEventListener("click", function(){
    downloadVCard(RUBIC_CARD);
  });
</script>
